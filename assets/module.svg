<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoagent: one container per user, reaching three services">
  <title>nanoagent</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <rect x="50" y="80" width="530" height="290" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="txt dim" x="80" y="108" font-size="12" font-weight="600">agent container — one per user</text>

  <rect x="80" y="120" width="470" height="50" rx="10" class="card"/>
  <text class="txt ink" x="100" y="142" font-size="13" font-weight="600">hypervisor</text>
  <text class="txt dim" x="100" y="159" font-size="10.5">:9090 — files, terminals and git for the platform</text>

  <rect x="80" y="190" width="470" height="50" rx="10" class="card"/>
  <text class="txt ink" x="100" y="212" font-size="13" font-weight="600">nanosec agent</text>
  <text class="txt dim" x="100" y="229" font-size="10.5">ReAct loop · tools · skills · cron · sub-agents</text>

  <rect x="80" y="270" width="470" height="50" rx="10" class="card"/>
  <text class="txt ink" x="100" y="292" font-size="13" font-weight="600">workspace volume</text>
  <text class="txt dim" x="100" y="309" font-size="10.5">files · memory/ · one JSONL transcript per session</text>

  <rect x="660" y="120" width="250" height="50" rx="10" class="card"/>
  <text class="txt ink" x="785" y="142" font-size="13" font-weight="600" text-anchor="middle">nanobus</text>
  <text class="txt dim" x="785" y="159" font-size="10.5" text-anchor="middle">messages</text>

  <rect x="660" y="190" width="250" height="50" rx="10" class="card"/>
  <text class="txt ink" x="785" y="212" font-size="13" font-weight="600" text-anchor="middle">nanoportal</text>
  <text class="txt dim" x="785" y="229" font-size="10.5" text-anchor="middle">its own row and settings</text>

  <rect x="660" y="270" width="250" height="50" rx="10" class="card"/>
  <text class="txt ink" x="785" y="292" font-size="13" font-weight="600" text-anchor="middle">nanoadmin</text>
  <text class="txt dim" x="785" y="309" font-size="10.5" text-anchor="middle">configuration and catalogue</text>

  <g class="wire">
    <line x1="550" y1="145" x2="660" y2="145"/>
    <line x1="550" y1="215" x2="660" y2="215"/>
    <line x1="550" y1="295" x2="660" y2="295"/>
  </g>
  <g class="txt" font-size="9.5" fill="#94A3B8" text-anchor="middle">
    <text x="605" y="139">tunnel</text>
    <text x="605" y="209">row</text>
    <text x="605" y="289">config</text>
  </g>

  <text class="txt dim" x="480" y="400" font-size="11" text-anchor="middle">no database connection of its own: the container's volume is the authority, and the console's projection is rebuilt from it</text>
</svg>
